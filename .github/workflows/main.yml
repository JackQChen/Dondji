name: Build Firmware

on:
  push:
    branches: [ main, motorola_r7 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Compile firmware
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh Fusion \
          -DENABLE_FEAT_F4HWN_QRCODE=OFF \
          -DENABLE_FEAT_F4HWN_CA=OFF \
          -DENABLE_FEAT_F4HWN_PMR=OFF \
          -DENABLE_FEAT_F4HWN_GMRS_FRS_MURS=OFF

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact
        path: build/**/*.bin
